name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Package executable and local import helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release/tools | Out-Null
          Copy-Item target/release/noram-browser.exe 'artifacts/release/NoRAM Browser.exe'
          Copy-Item tools/browser-cookie-export artifacts/release/tools -Recurse
          Copy-Item docs/IMPORT.md 'artifacts/release/Import guide.md'
      - uses: actions/upload-artifact@v4
        with:
          name: noram-browser-windows-x64
          path: artifacts/release/

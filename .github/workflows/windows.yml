name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - name: Native browser regression suites
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: output/playwright/
      - name: Compile development installer
        shell: pwsh
        run: |
          $version = (Select-String '^version = "([^"]+)"' Cargo.toml).Matches[0].Groups[1].Value
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" installer/noram.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed' }
      - name: Package executable and local import helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release/tools | Out-Null
          Copy-Item target/release/noram-browser.exe 'artifacts/release/NoRAM Browser.exe'
          Copy-Item tools/browser-cookie-export artifacts/release/tools -Recurse
          Copy-Item docs/IMPORT.md 'artifacts/release/Import guide.md'
      - uses: actions/upload-artifact@v4
        with:
          name: noram-browser-windows-x64
          path: |
            artifacts/release/
            artifacts/installer/

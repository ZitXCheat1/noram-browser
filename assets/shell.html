<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>NoRAM</title>
<style>
:root{font-family:'Segoe UI',sans-serif;color:#242824;background:#f8f9f5;font-synthesis:none;--muted:#70786d;--line:#e0e4da;--green:#244b35;--accent:#dfff81}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit;background:transparent}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #658b3a;outline-offset:2px}button:hover{background:#e7ebdf}.browser{height:110px;background:#eff2e9;border-bottom:1px solid var(--line)}.tabs{height:39px;display:flex;align-items:end;padding:5px 12px 0;gap:4px}.brand{font-size:12px;font-weight:800;letter-spacing:1.8px;align-self:center;margin:0 17px 0 5px;display:flex;align-items:center;gap:8px}.mark{display:inline-grid;place-items:center;background:var(--green);color:var(--accent);width:23px;height:23px;border-radius:7px;font-size:17px;letter-spacing:-2px;padding-right:2px}.tablist{display:flex;overflow:auto;gap:3px;scrollbar-width:none;max-width:calc(100vw - 240px)}.tab{min-width:110px;max-width:210px;width:180px;display:flex;align-items:center;border-radius:9px 9px 0 0;font-size:12px;height:34px;color:#626c5d;padding-left:10px}.tab.active{background:#f8f9f5;color:#202a1d;box-shadow:0 -1px 0 #dfe5d7}.tab .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;flex:1;padding:7px 3px}.tab .close{padding:6px 9px;border-radius:6px}.tab.sleep{font-style:italic}.new{font-size:22px;border-radius:6px;width:30px;height:32px}.private-badge{margin-left:auto;align-self:center;color:#6c4c96;font-size:11px;font-weight:700}.nav{height:49px;display:flex;align-items:center;padding:5px 15px;gap:7px}.icon{width:32px;height:32px;border-radius:8px;font-size:19px;flex-shrink:0}.omnibox{display:flex;align-items:center;border:1px solid #dbe1d2;border-radius:9px;background:#fff;height:35px;flex:1;box-shadow:0 1px 2px #20381b05}.security{font-size:10px;letter-spacing:.5px;color:var(--green);padding:0 11px;border-right:1px solid var(--line);white-space:nowrap}.omnibox input{border:0;outline:0!important;min-width:50px;flex:1;background:none;font-size:13px;padding:8px 10px;color:#344232}.star{font-size:21px;padding:0 12px}.shield{background:var(--green);color:#f0ffd4;border-radius:8px;font-size:12px;padding:9px 12px}.shield:hover{background:#386144}.status{height:21px;padding:0 20px;display:flex;align-items:center;gap:17px;color:#7a8272;font:10px Consolas,monospace;letter-spacing:.1px}.dot{display:inline-block;width:5px;height:5px;background:#6d9b4d;border-radius:50%;margin-right:5px}.status .right{margin-left:auto}.main{height:calc(100vh - 110px);overflow:auto}.workspace{display:flex;min-height:100%;max-width:1600px;margin:auto}.sidebar{width:210px;flex-shrink:0;border-right:1px solid var(--line);padding:31px 18px;display:flex;flex-direction:column;gap:5px}.section-label{font-size:10px;letter-spacing:1.6px;color:#8a9381;margin:20px 12px 12px;font-weight:600}.side{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 13px;border-radius:7px;font-size:12px;color:#68735d}.side.selected{background:#e8eedf;color:#284a28;font-weight:600}.side span{font-size:16px;width:18px}.side-footer{margin-top:auto;font-size:10px;color:#8d9586;line-height:1.8;padding:50px 12px 0}.content{padding:46px 6%;flex:1;min-width:0}.eyebrow{font-size:10px;letter-spacing:2px;color:#728360;text-transform:uppercase;display:flex;align-items:center;gap:8px}.pill{border:1px solid #dce3d2;border-radius:20px;padding:4px 9px;font-size:9px;letter-spacing:.5px}.hero{display:flex;justify-content:space-between;gap:30px;align-items:start;margin-top:30px}.hero h1{font-family:Georgia,serif;font-size:clamp(38px,4.3vw,66px);font-weight:400;line-height:1.08;letter-spacing:-2px;margin:0 0 17px;max-width:650px}.hero em{font-style:normal;color:#769153}.hero p{color:#818a77;font-size:12px;line-height:1.9;max-width:420px}.orbit{width:132px;height:132px;flex-shrink:0;position:relative;margin:10px 20px 0 0;display:grid;place-items:center}.orbit:before,.orbit:after{content:'';position:absolute;border:1px solid #d4dfc4;border-radius:50%;inset:0;transform:rotate(-25deg) scaleY(.46)}.orbit:after{transform:rotate(50deg) scaleY(.46)}.orb{background:var(--accent);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:34px Georgia;color:var(--green);box-shadow:0 0 40px #dfff8120}.orbit small{position:absolute;right:2px;top:25px;width:8px;height:8px;background:#46643d;border-radius:50%}.search{display:flex;margin-top:35px;border:1px solid #d5deca;background:#fff;border-radius:11px;padding:7px 8px 7px 18px;align-items:center;max-width:750px;box-shadow:0 7px 24px #364c2705}.search span{font-size:22px;color:#87947c}.search input{flex:1;border:0;outline:0!important;background:none;min-width:0;padding:12px;font-size:13px}.search button{background:var(--green);color:#eef9dc;border-radius:7px;padding:12px 17px;font-size:12px}.search-hint{font-size:10px;color:#8a9380;margin:12px 2px 35px}.stats{display:grid;grid-template-columns:repeat(3,1fr);max-width:750px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f3f5ee;margin-bottom:35px}.stat{padding:20px 22px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat .number{font-family:Georgia,serif;font-size:28px;letter-spacing:-1px;color:#35532d}.stat .number small{font-family:'Segoe UI',sans-serif;font-size:10px;letter-spacing:0;color:#819174}.stat p{font-size:10px;color:#849079;margin:8px 0 0}.row-heading{display:flex;align-items:center;justify-content:space-between;max-width:750px;margin:0 0 15px}.row-heading h2{font-size:11px;font-weight:600;letter-spacing:.2px}.row-heading span{font-size:10px;color:#8a9580}.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:750px}.shortcut{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:15px 13px;text-align:left}.shortcut b{background:#f0f3eb;border-radius:6px;width:28px;height:28px;display:grid;place-items:center;font-size:12px;color:#46643d}.shortcut div{font-size:11px}.shortcut small{display:block;color:#8c9682;font-size:9px;margin-top:3px}.note{margin:33px 0 0;border-top:1px solid var(--line);padding-top:18px;max-width:750px;display:flex;gap:12px;font-size:10px;color:#87927b;line-height:1.8}.note strong{color:#5f7451;font-weight:500}.page-title{font:38px Georgia;margin:14px 0 12px;letter-spacing:-1px}.description{font-size:12px;color:#7c8771;line-height:1.8;max-width:690px}.list{max-width:800px;margin-top:30px}.entry{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:12px 2px;gap:10px}.entry .open{flex:1;text-align:left;overflow:hidden;padding:4px;border-radius:5px}.entry b{display:block;font-size:13px;font-weight:500;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.entry small{display:block;color:#8c9583;font-size:10px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.settings{max-width:780px;margin-top:27px}.setting{display:flex;justify-content:space-between;align-items:center;gap:30px;padding:21px 0;border-bottom:1px solid var(--line)}.setting b{display:block;font-size:13px;font-weight:600}.setting p{font-size:11px;color:#839078;line-height:1.8;max-width:520px;margin-bottom:0}.setting input[type=checkbox]{accent-color:#365c39;width:19px;height:19px}.setting select{background:#fff;border:1px solid #d5dec9;padding:7px;border-radius:6px}.action{background:var(--green);color:#fff;padding:10px 17px;border-radius:7px;font-size:12px}.action:hover{background:#3f6641}.secondary{border:1px solid var(--line);color:#657658;background:#f1f4ec;padding:9px 14px;border-radius:7px;font-size:11px}.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.message{position:fixed;right:20px;bottom:18px;max-width:500px;background:#244b35;color:#efffda;border-radius:9px;padding:13px 20px;font-size:12px;box-shadow:0 5px 25px #0002;z-index:9;cursor:pointer}.empty{padding:35px 0;color:#8c9682;font-size:12px}.tools{display:flex;flex-wrap:wrap;gap:9px;margin-top:25px}.warning{border-left:2px solid #b6c69e;padding:0 15px;font-size:11px;color:#7f8b71;line-height:1.9;margin-top:28px;max-width:700px} [hidden]{display:none!important}@media(max-width:1000px){.sidebar{width:170px;padding:26px 10px}.content{padding:38px 5%}.orbit{display:none}.shortcuts{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:47px}}
</style></head><body>
<header class="browser">
 <div class="tabs"><div class="brand"><span class="mark">n.</span>NoRAM</div><div class="tablist" id="tabs"></div><button class="new" data-cmd="new" title="New tab (Ctrl+T)">+</button><span id="private" class="private-badge" hidden>PRIVATE WINDOW</span></div>
 <div class="nav"><button class="icon" data-cmd="back" title="Back">←</button><button class="icon" data-cmd="forward" title="Forward">→</button><button class="icon" id="reload" data-cmd="reload" title="Reload (Ctrl+R)">↻</button><button class="icon" id="home" title="New tab page">⌂</button><form class="omnibox" id="addressForm"><span class="security" id="security">NEW TAB</span><input id="address" autocomplete="off" spellcheck="false" aria-label="Address or search" placeholder="Search privately or enter a URL"><button type="button" class="star" data-cmd="bookmark" title="Bookmark (Ctrl+D)">☆</button></form><button class="shield" data-panel="shields">◈ &nbsp; Shields</button><button class="icon" data-panel="tools" title="Browser tools">☰</button></div>
 <div class="status"><span><i class="dot"></i><span id="privacy-status">SHIELDS ON</span></span><span id="live-status">0 LIVE TABS</span><span class="right">LESS NOISE. MORE INTERNET.</span></div>
</header>
<main class="main" id="main"><div class="workspace"><aside class="sidebar"><div class="section-label">YOUR SPACE</div><button class="side selected" data-panel="home"><span>⌂</span> Start page</button><button class="side" data-panel="bookmarks"><span>☆</span> Bookmarks</button><button class="side" data-panel="history"><span>◷</span> History</button><div class="section-label">BROWSER</div><button class="side" data-panel="shields"><span>◈</span> Privacy & shields</button><button class="side" data-panel="performance"><span>ϟ</span> Performance</button><button class="side" data-panel="tools"><span>⚙</span> Browser tools</button><button class="side" data-cmd="private"><span>◐</span> Private window</button><div class="side-footer">A little lighter.<br>A little more yours.<br><br>NO RAM? LESS RAM. &nbsp; v0.1</div></aside><section class="content" id="content"></section></div></main>
<div id="message" class="message" hidden role="status" onclick="this.hidden=true"></div>
<script>
'use strict';
let state=null, panel='home', lastMessage='', lastShape='', zoom=1;
const $=id=>document.getElementById(id);
const send=(cmd,extra={})=>{if(window.ipc)window.ipc.postMessage(JSON.stringify({cmd,...extra}));};
const el=(tag,text,cls)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const active=()=>state?.tabs.find(t=>t.id===state.active);
function focusAddress(){$('address').focus();$('address').select();}
function showPanel(name){panel=name;lastShape='';send('panel',{open:name!=='home'||active()?.url!=='noram://newtab'});draw();}
document.addEventListener('click',e=>{const cmd=e.target.closest('[data-cmd]');if(cmd){send(cmd.dataset.cmd);return;}const p=e.target.closest('[data-panel]');if(p)showPanel(p.dataset.panel);});
$('addressForm').onsubmit=e=>{e.preventDefault();send('navigate',{url:$('address').value});panel='home';lastShape='';};
$('home').onclick=()=>{panel='home';lastShape='';send('navigate',{url:'noram://newtab'});};
function update(next){
 const previous=active()?.id;state=next;let t=active();
 if(previous!==t?.id){panel='home';lastShape='';}
 const tabs=$('tabs');tabs.replaceChildren();
 for(const tab of state.tabs){let n=el('div',undefined,'tab'+(tab.id===state.active?' active':'')+(tab.sleeping?' sleep':''));let label=el('button',(tab.pinned?'⌑ ':tab.sleeping?'◷ ':tab.loading?'◌ ':'')+tab.title,'label');label.title=tab.url;label.onclick=()=>send('switch',{id:tab.id});let close=el('button','×','close');close.title='Close tab';close.onclick=()=>send('close',{id:tab.id});n.append(label,close);tabs.append(n);}
 if(document.activeElement!==$('address'))$('address').value=t?.url==='noram://newtab'?'':t?.url||'';
 $('private').hidden=!state.private;$('security').textContent=t?.url.startsWith('https:')?'HTTPS':t?.url.startsWith('http:')?'HTTP':'NEW TAB';
 $('privacy-status').textContent=state.settings.shields?'SHIELDS ON':'SHIELDS OFF';$('live-status').textContent=state.live+' LIVE TABS · '+state.blocked+' BLOCKED';
 $('reload').dataset.cmd=t?.loading?'stop':'reload';$('reload').textContent=t?.loading?'×':'↻';
 if(state.message && state.message!==lastMessage){$('message').textContent=state.message;$('message').hidden=false;lastMessage=state.message;}
 draw();
}
function draw(){
 if(!state)return;
 const shape=JSON.stringify([panel,state.active,state.bookmarks,state.history,state.settings,active()?.pinned]);
 if(shape===lastShape){for(const n of document.querySelectorAll('[data-stat="blocked"]'))n.textContent=state.blocked;for(const n of document.querySelectorAll('[data-stat="live"]'))n.textContent=state.live;return;}
 lastShape=shape;
 for(const b of document.querySelectorAll('.side[data-panel]'))b.classList.toggle('selected',b.dataset.panel===panel);
 const c=$('content');c.replaceChildren();
 if(panel==='home'){home(c);return;}
 let label=el('div','YOUR BROWSER, YOUR RULES','eyebrow');c.append(label);
 const titles={bookmarks:'Your corner of the web.',history:'Where you’ve been.',shields:'A quieter internet.',performance:'Room to breathe.',tools:'The useful things.'};
 c.append(el('h1',titles[panel],'page-title'));
 let close=el('button','← Back to page','secondary');close.onclick=()=>{panel='home';send('panel',{open:false});lastShape='';draw();};c.append(close);
 if(panel==='bookmarks'||panel==='history'){list(c,panel);return;}
 if(panel==='shields'||panel==='performance'){settings(c);return;}
 c.append(el('p','Page controls, private browsing, and developer tools.','description'));
 let tools=el('div',undefined,'tools');
 for(const [label,cmd] of [['Print / save PDF','print'],['Developer tools · F12','devtools'],[active()?.pinned?'Unpin tab':'Pin / keep tab awake','pin'],['Unload current tab','sleep'],['New private window','private']]){let b=el('button',label,'secondary');b.onclick=()=>send(cmd);tools.append(b);}
 c.append(tools);
 let f=el('form',undefined,'search');let inp=el('input');inp.placeholder='Find text on this page';inp.setAttribute('aria-label','Find text');let btn=el('button','Find next');f.append(inp,btn);f.onsubmit=e=>{e.preventDefault();send('panel',{open:false});send('find',{text:inp.value});};c.append(f);
 let z=el('div',undefined,'actions');for(const [label,value] of [['Zoom out',-.1],['Reset zoom',0],['Zoom in',.1]]){let b=el('button',label,'secondary');b.onclick=()=>{zoom=value===0?1:Math.min(3,Math.max(.25,zoom+value));send('zoom',{value:zoom});};z.append(b);}c.append(z);
 c.append(el('p','Downloads use WebView2’s native handling. Right-click a page for copy, save, inspect, and navigation controls. Web extensions, account sync, password management and DRM parity are not included.','warning'));
}
function home(c){
 let eye=el('div',undefined,'eyebrow');eye.append(el('span','●'),el('span',state.private?'PRIVATE BY SESSION':'A FRESH PERSPECTIVE'),el('span','WINDOWS · RUST','pill'));c.append(eye);
 let hero=el('div',undefined,'hero'),copy=el('div'),title=el('h1');title.append(document.createTextNode('The internet.'),el('br'),el('em','Without the weight.'));copy.append(title,el('p','A quiet place to explore. Fewer distractions, fewer live tabs, and more room for what matters.'));let orbit=el('div',undefined,'orbit');orbit.append(el('div','n.','orb'),el('small'));hero.append(copy,orbit);c.append(hero);
 let search=el('form',undefined,'search');let input=el('input');input.placeholder='Where would you like to go?';input.setAttribute('aria-label','Search privately');let button=el('button','Explore →');search.append(el('span','⌕'),input,button);search.onsubmit=e=>{e.preventDefault();send('navigate',{url:input.value});};c.append(search,el('div','DuckDuckGo search  ·  Ctrl + L to jump to the address bar','search-hint'));
 let stats=el('div',undefined,'stats');for(const [number,label,key,suffix] of [[state.blocked,'Requests blocked this session','blocked',''],[state.live,'Currently loaded web pages','live',' / '+state.settings.max_live_tabs],[state.rules,'Bundled domain blocking rules','rules','']]){let s=el('div',undefined,'stat'),n=el('div',undefined,'number'),v=el('span',number);v.dataset.stat=key;n.append(v,el('small',suffix));s.append(n,el('p',label));stats.append(s);}c.append(stats);
 let heading=el('div',undefined,'row-heading');heading.append(el('h2','A few places to start'),el('span','THE OPEN WEB ↗'));c.append(heading);
 let links=el('div',undefined,'shortcuts');for(const [letter,name,host] of [['W','Wikipedia','wikipedia.org'],['G','GitHub','github.com'],['H','Hacker News','news.ycombinator.com'],['D','DuckDuckGo','duckduckgo.com']]){let b=el('button',undefined,'shortcut'),d=el('div',name);d.append(el('small',host));b.append(el('b',letter),d);b.onclick=()=>send('navigate',{url:'https://'+host});links.append(b);}c.append(links);
 let note=el('div',undefined,'note');note.append(el('span','◈'),el('div',state.private?'Private window: no NoRAM history or session is saved. Websites and your network can still identify or observe activity.':'Shields block known advertising and analytics domains. Inactive tabs unload when the live-tab budget is exceeded. Pin tabs with work you need to keep.'));c.append(note);
}
function list(c,key){
 c.append(el('p',key==='history'?(state.private?'This private window does not record browsing history.':'Recent pages on this device. History is capped at 2,000 entries; the latest 150 appear here.'):'Keep the pages you want to come back to. Ctrl + D bookmarks the current page.','description'));
 if(key==='history'){let clear=el('button','Clear history','secondary');clear.onclick=()=>send('clear_history');c.append(clear);}
 let rows=el('div',undefined,'list');let entries=state.private&&key==='history'?[]:state[key];
 if(!entries.length)rows.append(el('div','Nothing here yet. The web is waiting.','empty'));
 for(const entry of entries){let row=el('div',undefined,'entry'),open=el('button',undefined,'open');open.append(el('b',entry.title),el('small',entry.url));open.onclick=()=>{panel='home';send('navigate',{url:entry.url});};row.append(open);if(key==='bookmarks'){let del=el('button','×','icon');del.title='Remove bookmark';del.onclick=()=>send('remove_bookmark',{url:entry.url});row.append(del);}rows.append(row);}c.append(rows);
}
function settings(c){
 const privacy=panel==='shields';c.append(el('p',privacy?'A conservative starting point. All website permissions are denied, including camera, microphone, location and notifications. Strict engine tracking prevention is always enabled.':'The most useful optimization is doing less. NoRAM unloads the least recently used unpinned background page when the live-tab budget is exceeded.','description'));
 const form=el('form',undefined,'settings');
 const defs=privacy?[['shields','Block ads & trackers','Block requests to the bundled domain list. This does not remove all ads or stop every tracker.'],['https_only','Require HTTPS','Upgrade public HTTP navigations and block insecure resources. Localhost remains available for development.'],['strip_tracking','Clean tracking parameters','Remove known click identifiers and utm_ parameters from navigations. May affect signed or specialized links.']]:[];
 for(const [key,title,desc] of defs){let label=el('label',undefined,'setting'),copy=el('div');copy.append(el('b',title),el('p',desc));let input=el('input');input.type='checkbox';input.name=key;input.checked=state.settings[key];label.append(copy,input);form.append(label);}
 if(!privacy){let label=el('label',undefined,'setting'),copy=el('div');copy.append(el('b','Maximum live web pages'),el('p','Pinned tabs are exempt. Unloading discards in-page history, scroll, media and unsaved work; select the tab to reload its URL. The browser interface uses an additional webview.'));let select=el('select');select.name='max_live_tabs';for(const n of [1,2,3,4,6,8,12,16]){let option=el('option',n+' pages');option.value=n;option.selected=n===state.settings.max_live_tabs;select.append(option);}label.append(copy,select);form.append(label);}
 let save=el('button','Save preferences','action');save.style.marginTop='22px';form.append(save);form.onsubmit=e=>{e.preventDefault();let settings={...state.settings};for(const [key] of defs)settings[key]=form.elements[key].checked;if(!privacy)settings.max_live_tabs=Number(form.elements.max_live_tabs.value);send('settings',{settings});};c.append(form);
 if(privacy){let actions=el('div',undefined,'actions');for(const [label,cmd] of [['Toggle shields for current site','exception'],['Clear cookies & site storage','clear_data']]){let b=el('button',label,'secondary');b.onclick=()=>{if(cmd==='clear_data'&&!confirm('Clear cookies, cache and site storage for this profile? This signs you out of websites.'))return;send(cmd);};actions.append(b);}c.append(actions);let exceptions=Array.from(state.settings.exceptions);c.append(el('p','Shield exceptions: '+(exceptions.join(', ')||'none')+'. A site exception affects domain blocking; strict engine tracking prevention still applies. DNT and GPC request signals are sent but depend on site support.','warning'));}
 else c.append(el('p','No zero-RAM promise. WebView2 is Chromium and uses multiple processes. This version has no verified speed or memory advantage over Chrome, Brave or Firefox. Pin tabs with forms, calls, or downloads in progress.','warning'));
}
send('ready');
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>NoRAM</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header id="chrome">
<div class="tabstrip"><button class="brand icon-button" data-panel="home" title="NoRAM start page" aria-label="Start page"><span class="brand-mark">n</span></button><div id="tabs" role="tablist" aria-label="Browser tabs"></div><button class="icon-button new-tab" data-cmd="new" title="New tab (Ctrl+T)" aria-label="New tab" data-icon="plus"></button><div class="window-tools"><span id="private-badge" hidden>Private</span><button class="icon-button" data-panel="tabs" title="Search tabs (Ctrl+Shift+A)" aria-label="Search tabs" data-icon="circle-down"></button></div></div>
<div class="toolbar"><div class="navigation"><button class="icon-button" data-cmd="back" aria-label="Back" title="Back" data-icon="arrow-left2"></button><button class="icon-button" data-cmd="forward" aria-label="Forward" title="Forward" data-icon="arrow-right2"></button><button class="icon-button" id="reload" data-cmd="reload" aria-label="Reload" title="Reload (Ctrl+R)" data-icon="loop2"></button></div>
<form id="addressForm" class="addressbox"><span id="security" class="site-security" title="Connection security" data-icon="search"></span><input id="address" aria-label="Address or search" placeholder="Search or enter an address" autocomplete="off" spellcheck="false"><button type="button" class="icon-button" id="star" data-cmd="bookmark" aria-label="Bookmark this page" title="Bookmark this page (Ctrl+D)" data-icon="bookmark"></button></form>
<div class="toolbar-actions"><button class="icon-button shield-button" data-panel="shields" title="Privacy shields" aria-label="Privacy shields" data-icon="shield"></button><button class="icon-button extension-button" data-panel="extensions" title="Extensions" aria-label="Extensions" data-icon="embed2"></button><button class="icon-button" data-panel="tools" title="Browser menu" aria-label="Browser menu" data-icon="menu"></button></div></div>
<nav id="bookmark-bar" aria-label="Bookmarks bar" hidden></nav>
</header>
<main id="main"><aside id="sidebar" hidden><div class="sidebar-title">Your browser</div><nav id="side-nav"></nav><div class="sidebar-footer">NoRAM 0.2<br><span>Less noise. More internet.</span></div></aside><section id="content"></section></main>
<div id="toast" role="status" hidden><span id="toast-text"></span><button class="icon-button" id="dismiss-toast" aria-label="Dismiss message" data-icon="cross"></button></div>
<dialog id="edit-dialog"><form id="edit-form"><h2>Edit bookmark</h2><label>Name<input id="bookmark-name" required maxlength="200"></label><div class="dialog-actions"><button type="button" class="button secondary" id="cancel-edit">Cancel</button><button class="button primary">Save bookmark</button></div></form></dialog>
</body></html>

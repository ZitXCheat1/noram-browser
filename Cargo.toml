[package]
name = "noram-browser"
version = "0.2.0"
edition = "2021"
description = "A lean Windows browser shell with native request blocking and disposable tabs"
license = "MIT"

[dependencies]
anyhow = "1"
adblock = "=0.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
regex = "1"
html-escape = "=0.3.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
semver = "1"
sha2 = "0.10"
tao = "=0.35.3"
wry = { version = "=0.55.1", features = ["devtools"] }
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Com"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

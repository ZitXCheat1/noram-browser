[package]
name = "noram-browser"
version = "0.1.0"
edition = "2021"
description = "A lean Windows browser shell with native request blocking and disposable tabs"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tao = "=0.35.3"
wry = { version = "=0.55.1", features = ["devtools"] }
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
